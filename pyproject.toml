[project]
name = "iphone-sync-macos"
version = "1.0.3"
description = "Automatically copy iPhone photos and videos when plugged in via USB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymobiledevice3>=4.0",
    "PySide6>=6.6",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "av>=12.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[project.optional-dependencies]
dev = [
    "setuptools>=68,<70",
    "py2app>=0.28",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
iphone-sync-macos = "iphone_sync.app:main"
iphone-gallery-macos = "iphone_sync.gallery_app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests exercising multiple components together",
]
